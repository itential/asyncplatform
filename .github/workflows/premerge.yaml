# .github/workflows/premerge.yaml
---
name: Run pre-merge pipeline

on:
  pull_request:
    branches:
      - devel

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up uv cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-
            uv-${{ runner.os }}-

      - name: Install the project
        run: uv sync --all-extras --group dev

      - name: Check code formatting
        run: uv run ruff format --check src/asyncplatform tests

      - name: Run linting
        run: |
          uv run ruff check src/asyncplatform
          uv run ruff check tests

      - name: Run type checking
        run: uv run mypy src/asyncplatform

      - name: Run security analysis
        run: uv run bandit -r src/asyncplatform --configfile pyproject.toml

      - name: Run tests with coverage
        run: uv run pytest --cov=src/asyncplatform --cov-report=term --cov-report=xml --cov-report=html tests/ -v

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false
        if: matrix.python-version == '3.12'

      - name: Upload coverage HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.python-version }}
          path: htmlcov/
        if: always()

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            coverage.xml
            .coverage
        if: always()
