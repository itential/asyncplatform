# .github/workflows/pre-release.yaml
# This workflow publishes pre-release versions to TestPyPI for validation
# before publishing to production PyPI. Triggered by tags with pre-release
# identifiers (rc, alpha, beta) or manually for testing.
---
name: Pre-release to TestPyPI

on:
  push:
    tags:
      - 'v*-rc*'
      - 'v*-alpha*'
      - 'v*-beta*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # Required for trusted publishing to TestPyPI

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing pre-release version: ${VERSION}"

      - name: Validate version format
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(rc|alpha|beta)\.[0-9]+$ ]]; then
            echo "Error: Version must be a valid pre-release (e.g., 1.0.0-rc.1, 1.0.0-alpha.1)"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --all-extras --group dev

      - name: Run linting
        run: |
          uv run ruff check src/asyncplatform
          uv run ruff check tests

      - name: Run security analysis
        run: uv run bandit -r src/asyncplatform --configfile pyproject.toml

      - name: Run tests
        run: uv run pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --all-extras --group dev

      - name: Build package
        run: uv run python -m build

      - name: Validate build artifacts
        run: |
          ls -lh dist/
          if [ ! -f dist/*.whl ] || [ ! -f dist/*.tar.gz ]; then
            echo "Error: Build artifacts missing"
            exit 1
          fi

      - name: Check package metadata
        run: |
          uv run python -m pip install twine
          uv run twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-testpypi
          path: dist/
          retention-days: 30

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/asyncplatform
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-testpypi
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          print-hash: true

      - name: Installation test information
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          echo "📦 Pre-release published to TestPyPI!"
          echo ""
          echo "To test the installation, run:"
          echo "  pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ asyncplatform==${VERSION}"
          echo ""
          echo "Or use uv:"
          echo "  uv pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ asyncplatform==${VERSION}"
          echo ""
          echo "View on TestPyPI: https://test.pypi.org/project/asyncplatform/${VERSION}/"
